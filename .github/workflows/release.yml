name: Release

# Publishes an APK to GitHub Releases.
#  - Signed release APK when the signing secrets are configured:
#      SMARTCHEAT_KEYSTORE_BASE64, SMARTCHEAT_KEYSTORE_PASSWORD (required); SMARTCHEAT_KEY_ALIAS (optional when the
#      keystore holds one key), SMARTCHEAT_KEY_PASSWORD (optional: defaults to the keystore password)
#  - Otherwise a clearly labelled, debug-signed beta/test build published as a pre-release.
# An existing release with the same tag is never overwritten.
# Triggers: a pushed v* tag, a manual run, or a successful CI run on the default branch.
# CI-triggered releases are numbered automatically: the last vX.Y.Z tag + 1 in the patch number (v1.0.1, v1.0.2…),
# published as the latest release; once published, all older releases and their tags are deleted.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.5.0-test.1"
        required: true
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      # Signing needs at least the keystore and its password; with only one of them the debug-signed beta is built.
      HAS_SIGNING: ${{ secrets.SMARTCHEAT_KEYSTORE_BASE64 != '' && secrets.SMARTCHEAT_KEYSTORE_PASSWORD != '' }}
      SIGNING_INCOMPLETE: ${{ (secrets.SMARTCHEAT_KEYSTORE_BASE64 != '') != (secrets.SMARTCHEAT_KEYSTORE_PASSWORD != '') }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Derive tag for CI-triggered builds
        if: github.event_name == 'workflow_run'
        run: |
          # Skip if this exact commit is already released under a v* tag (e.g. a manual test release).
          if gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch --limit 50 \
               --json headSha --jq '.[].headSha' | grep -q "^${RELEASE_SHA}$"; then
            echo "A manual release run exists for $RELEASE_SHA; not publishing a duplicate."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            exit 0
          fi
          if git ls-remote --tags origin 'v*' | grep -q "^${RELEASE_SHA}"; then
            echo "Commit $RELEASE_SHA already has a release tag; not publishing a duplicate."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            exit 0
          fi
          # Next version: highest plain vX.Y.Z tag + 1 in the patch number; the first one is v1.0.1.
          LAST=$(git ls-remote --tags origin 'v*' | sed -E 's#.*refs/tags/##; s#\^\{\}$##' \
                 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -z "$LAST" ]; then
            NEXT="1.0.1"
          else
            IFS=. read -r MA MI PA <<< "${LAST#v}"
            NEXT="$MA.$MI.$((PA + 1))"
          fi
          echo "Last release tag: ${LAST:-none} -> v$NEXT"
          echo "TAG=v$NEXT" >> "$GITHUB_ENV"
          echo "AUTO_RELEASE=true" >> "$GITHUB_ENV"

      - name: Validate tag and refuse duplicates
        if: env.SKIP_RELEASE != 'true'
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3 or v1.2.3-test.1"; exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to upload a duplicate."; exit 1
          fi
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        if: env.SKIP_RELEASE != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        if: env.SKIP_RELEASE != 'true'

      - name: Tests (release gate)
        if: env.SKIP_RELEASE != 'true'
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug

      - name: Report incomplete signing secrets
        if: env.SKIP_RELEASE != 'true' && env.SIGNING_INCOMPLETE == 'true'
        run: |
          echo "::warning::Release signing needs both repository secrets SMARTCHEAT_KEYSTORE_BASE64 and SMARTCHEAT_KEYSTORE_PASSWORD; only one is set. Building the debug-signed beta instead."

      - name: Build signed release APK
        if: env.SKIP_RELEASE != 'true' && env.HAS_SIGNING == 'true'
        env:
          SMARTCHEAT_KEYSTORE_BASE64: ${{ secrets.SMARTCHEAT_KEYSTORE_BASE64 }}
          SMARTCHEAT_KEYSTORE_PASSWORD: ${{ secrets.SMARTCHEAT_KEYSTORE_PASSWORD }}
          SMARTCHEAT_KEY_ALIAS: ${{ secrets.SMARTCHEAT_KEY_ALIAS }}
          SMARTCHEAT_KEY_PASSWORD: ${{ secrets.SMARTCHEAT_KEY_PASSWORD }}
        run: |
          export SMARTCHEAT_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$SMARTCHEAT_KEYSTORE_FILE"' EXIT
          # Secrets pasted with line breaks (base64 -w76) or a trailing newline still decode.
          printf '%s' "$SMARTCHEAT_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$SMARTCHEAT_KEYSTORE_FILE" || {
            echo "::error::SMARTCHEAT_KEYSTORE_BASE64 is not valid base64 (encode the .jks/.keystore file with: base64 -w0 release.jks)"; exit 1; }
          if [ -z "$SMARTCHEAT_KEYSTORE_PASSWORD" ]; then
            echo "::error::Repository secret SMARTCHEAT_KEYSTORE_PASSWORD is missing or empty"; exit 1
          fi
          # Which keys does the keystore hold? (Values of secrets are never printed.)
          if ! ENTRIES=$(keytool -list -keystore "$SMARTCHEAT_KEYSTORE_FILE" -storepass:env SMARTCHEAT_KEYSTORE_PASSWORD 2>&1); then
            echo "::error::The keystore could not be opened: wrong SMARTCHEAT_KEYSTORE_PASSWORD, or SMARTCHEAT_KEYSTORE_BASE64 is not a keystore"; exit 1
          fi
          ALIASES=$(printf '%s\n' "$ENTRIES" | grep -i 'PrivateKeyEntry' | cut -d, -f1 | sed 's/[[:space:]]*$//')
          COUNT=$(printf '%s\n' "$ALIASES" | grep -c . || true)
          echo "The keystore holds $COUNT private key(s)."
          if [ -z "$SMARTCHEAT_KEY_ALIAS" ]; then
            # The alias secret is optional when the keystore holds exactly one key.
            if [ "$COUNT" = "1" ]; then
              export SMARTCHEAT_KEY_ALIAS="$ALIASES"
              echo "SMARTCHEAT_KEY_ALIAS is not set: using the keystore's only key."
            else
              echo "::error::Repository secret SMARTCHEAT_KEY_ALIAS is missing and the keystore holds $COUNT keys — set it to the alias to sign with"; exit 1
            fi
          elif ! printf '%s\n' "$ALIASES" | grep -qixF "$SMARTCHEAT_KEY_ALIAS"; then
            echo "::error::SMARTCHEAT_KEY_ALIAS does not match any key in the keystore ($COUNT key(s) found)"; exit 1
          fi
          # PKCS12 keystores use the store password for the key as well.
          [ -n "$SMARTCHEAT_KEY_PASSWORD" ] || { export SMARTCHEAT_KEY_PASSWORD="$SMARTCHEAT_KEYSTORE_PASSWORD"; echo "SMARTCHEAT_KEY_PASSWORD is not set: using the keystore password."; }
          export SMARTCHEAT_VERSION_NAME="$VERSION_NAME" SMARTCHEAT_VERSION_CODE="${{ github.run_number }}"
          ./gradlew --no-daemon :app:assembleRelease
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"
          mkdir -p dist && cp "$APK" "dist/PS4-SmartCheat-v$VERSION_NAME.apk"
          echo "KIND=release" >> "$GITHUB_ENV"

      - name: Build debug-signed TEST APK (no signing secrets)
        if: env.SKIP_RELEASE != 'true' && env.HAS_SIGNING != 'true'
        run: |
          export SMARTCHEAT_VERSION_NAME="$VERSION_NAME" SMARTCHEAT_VERSION_CODE="${{ github.run_number }}"
          ./gradlew --no-daemon :app:assembleDebug
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          # Automatic (and beta) builds are the public build: plain name. Other debug-signed builds are marked -test.
          if [ "${AUTO_RELEASE:-}" = "true" ]; then OUT="PS4-SmartCheat-v$VERSION_NAME.apk"
          else case "$VERSION_NAME" in
            *-beta*) OUT="PS4-SmartCheat-v$VERSION_NAME.apk" ;;
            *)       OUT="PS4-SmartCheat-v$VERSION_NAME-test.apk" ;;
          esac; fi
          mkdir -p dist && cp "$APK" "dist/$OUT"
          echo "KIND=test" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        if: env.SKIP_RELEASE != 'true'
        run: |
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cd ..
          APK_NAME=$(basename dist/*.apk)
          BASE="${VERSION_NAME%%-*}"
          BUILD=$(echo "$VERSION_NAME" | sed -nE 's/.*(-build|-beta)\.([0-9]+)$/\2/p')
          # Titles: "PS4 SmartCheat v1.0.1" (automatic public build, or signed) · "PS4 SmartCheat v1.0.0 · Test build 46"
          # (other debug-signed builds, pre-release). Automatic builds are marked "Latest" so the Releases sidebar
          # links straight to the app.
          if [ "${AUTO_RELEASE:-}" = "true" ]; then
            TITLE="PS4 SmartCheat v$VERSION_NAME"; FLAGS="--latest"; export CHANNEL=beta
          elif [ "${VERSION_NAME#*-beta}" != "$VERSION_NAME" ]; then
            TITLE="PS4 SmartCheat v$BASE Beta${BUILD:+ · build $BUILD}"; FLAGS="--latest"
          elif [ "$KIND" = "release" ]; then
            TITLE="PS4 SmartCheat v$BASE"; FLAGS="--latest"
          else
            TITLE="PS4 SmartCheat v$BASE · Test build ${BUILD:-${VERSION_NAME#*-}}"; FLAGS="--prerelease"
          fi
          ../.github/scripts/release-notes.sh "$VERSION_NAME" "$KIND" "$APK_NAME" "$RELEASE_SHA" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
            --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" $FLAGS

      - name: Delete older releases
        # Only after the new release exists: keep a single, current release (and remove the old tags with it).
        if: env.SKIP_RELEASE != 'true' && env.AUTO_RELEASE == 'true'
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | while read -r t; do
            [ "$t" = "$TAG" ] && continue
            gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag && echo "deleted release $t"
          done
