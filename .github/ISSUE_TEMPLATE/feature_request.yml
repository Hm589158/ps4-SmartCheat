name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Out of scope by design: online/multiplayer cheating, anti-cheat evasion, DRM bypass, save editing, kernel memory editing.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could the app help?
